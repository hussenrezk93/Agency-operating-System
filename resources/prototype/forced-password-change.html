<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Agency OS — Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/agencyos.css">
<script defer src="assets/i18n.js"></script>
<script defer src="assets/guards.js"></script>
<script defer src="assets/mock-data.js"></script>
<script defer src="assets/demo-store.js"></script>
<script defer src="assets/agencyos.js"></script>
<script defer src="assets/locale-patch.js"></script>
</head>
<body data-shell="none">
<div class="auth" data-live>
  <div class="auth-card" style="max-width:420px;width:100%">
    <h1 style="font-size:19px;margin:0 0 6px" data-i18n="pw.change">Change password</h1>
    <p class="muted small" id="forcedNote" style="margin:0 0 16px;display:none" data-i18n="pw.forced">·</p>
    <form id="f" novalidate>
      <div class="field" id="fCur"><label data-i18n="pw.current">Current</label><input type="password" id="cur"><div class="err"></div></div>
      <div class="field" id="fNew"><label data-i18n="pw.new">New</label><input type="password" id="npw"><div class="err" data-i18n="pw.short">·</div></div>
      <div class="field" id="fCf"><label data-i18n="pw.confirm">Confirm</label><input type="password" id="cpw"><div class="err" data-i18n="pw.mismatch">·</div></div>
      <p class="small muted" data-i18n="pw.rule">Min 8 chars.</p>
      <button class="btn btn-primary" style="width:100%;justify-content:center" data-i18n="common.save">Save</button>
    </form>
  </div>
</div>
<script>
window.PAGE_INIT=function(){
  var FORCED=1, T=APP.t;
  if(FORCED) document.getElementById("forcedNote").style.display="block";
  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault();
    var n=document.getElementById("npw"), c=document.getElementById("cpw");
    var ok=true;
    document.getElementById("fNew").classList.toggle("bad",n.value.length<8); if(n.value.length<8) ok=false;
    document.getElementById("fCf").classList.toggle("bad",n.value!==c.value); if(n.value!==c.value) ok=false;
    if(!ok){ APP.toast(T("toast.invalid"),"danger"); return; }
    var s=APPG.session(); if(s){ s.mustChange=false; APPG.setSession(s); }
    STORE.audit("user.password_changed","user #"+STORE.me().id+" · "+STORE.me().name,"—","password rotated");
    APP.toast(T("pw.done"),"success");
    setTimeout(function(){ location.href=APP.withP(APPG.HOME[(s&&s.role)||"employee"]); },800);
  });
};
</script>
</body>
</html>
